<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BOM for Agentic Engineering</title>
<script>
  // apply the saved theme before first paint so there is no dark flash
  try {
    if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');
  } catch { /* storage unavailable: stay dark */ }
</script>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    font-style: normal;
    font-weight: 500;
    src: url('vendor/SpaceGrotesk.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Space Grotesk';
    font-style: normal;
    font-weight: 700;
    src: url('vendor/SpaceGrotesk.woff2') format('woff2');
  }

  /* night chrome sits on Mantel navy (#002a41), lines and muted ink lean on
     Mantel blue (#1e5e82) and sky (#81ccea) */
  :root {
    --bg: #002a41;
    --panel: rgba(0, 32, 50, 0.88);
    --ink: #eaf3f9;
    --ink-2: #a9c3d4;
    --ink-3: #7595ab;
    --line: #1b4b69;
    --accent: #22d3ee;
    /* accent used as text/marker ink; light theme darkens it for contrast */
    --accent-ink: var(--accent);
    --chip-bg: rgba(129, 204, 234, 0.05);
    --card-shadow: 0 20px 60px rgba(0, 8, 16, 0.55);
    --notes-bg: rgba(0, 26, 41, 0.92);
    --notes-line: #2f6688;
  }
  :root.light {
    --bg: #e9edf2;
    --panel: rgba(255, 255, 255, 0.9);
    --ink: #16202a;
    --ink-2: #46525f;
    --ink-3: #6d7986;
    --line: #cbd3dc;
    --accent-ink: color-mix(in srgb, var(--accent) 62%, #16202a);
    --chip-bg: rgba(11, 13, 16, 0.03);
    --card-shadow: 0 20px 60px rgba(15, 23, 32, 0.2);
    --notes-bg: rgba(255, 255, 255, 0.94);
    --notes-line: #aeb9c4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Space Grotesk", "Avenir Next", ui-sans-serif, sans-serif;
    font-weight: 500;
    overflow: hidden;
  }
  #scene canvas { cursor: grab; }
  #scene canvas:active { cursor: grabbing; }
  .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; }

  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }

  .hud { position: fixed; z-index: 10; pointer-events: none; }

  #act {
    top: 22px; left: 26px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-2);
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    background: var(--panel);
  }

  /* the key bar stays hidden while presenting; H shows it */
  #hint {
    display: none;
    top: 22px; right: 26px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12.5px; color: var(--ink-3);
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }
  #hint b { color: var(--ink-2); font-weight: 600; }
  body.showhint #hint { display: block; }

  #card {
    left: 26px; bottom: 26px;
    max-width: 620px;
    transform-origin: left bottom;
    transform: scale(var(--hud-scale, 1));
    padding: 22px 26px 20px;
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 16px;
    background: var(--panel);
    backdrop-filter: blur(6px);
    pointer-events: auto;
    box-shadow: var(--card-shadow);
  }
  #kicker {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent-ink);
  }
  #title {
    margin: 6px 0 10px;
    font-size: 42px; font-weight: 700; line-height: 1.06;
    letter-spacing: -0.01em;
  }
  #bullets {
    margin: 0; padding: 0 0 0 20px;
    font-size: 18.5px; line-height: 1.5; color: var(--ink-2);
    display: grid; gap: 6px;
  }
  #bullets li::marker { color: var(--accent-ink); }

  #chips {
    display: none; flex-wrap: wrap; gap: 8px;
    margin-top: 16px;
  }

  /* QR box: its own panel at the bottom right, above the progress dots, so a
     large code never pushes the card up into the scene */
  #qrbox {
    right: 26px; bottom: 112px;
    display: none; gap: 22px;
    transform-origin: right bottom;
    transform: scale(var(--hud-scale, 1));
    padding: 18px 20px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    backdrop-filter: blur(6px);
    box-shadow: var(--card-shadow);
  }
  .qr-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .qr-item img {
    width: 180px; height: 180px; display: block;
    background: #fff; border-radius: 10px;
  }
  .qr-t { font-size: 15px; color: var(--ink-2); }
  .qr-u { font-size: 14px; color: var(--accent-ink); letter-spacing: 0.02em; }
  .chip {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 13px; letter-spacing: 0.05em;
    padding: 5px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink-3);
    background: var(--chip-bg);
    transition: all 160ms ease;
  }
  .chip.on { color: var(--ink); border-color: var(--accent); }
  .chip.cur { background: var(--accent); color: #002a41; font-weight: 700; }

  #progress {
    right: 26px; bottom: 26px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  #stepnum {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 18px; color: var(--ink-2); letter-spacing: 0.1em;
    padding: 6px 14px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel);
  }
  #dots { display: flex; gap: 5px; max-width: 340px; flex-wrap: wrap; justify-content: flex-end; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--dc, #444); opacity: 0.25;
    transition: all 160ms ease;
  }
  .dot.on { opacity: 1; transform: scale(1.5); box-shadow: 0 0 8px var(--dc); }

  #notesbar {
    right: 26px; bottom: 118px;
    width: min(880px, calc(100vw - 880px));
    min-width: 380px;
    max-height: 34vh; overflow: auto;
    padding: 14px 20px;
    border: 1px dashed var(--notes-line);
    border-radius: 16px;
    background: var(--notes-bg);
    display: none;
    pointer-events: auto;
  }
  body.shownotes #notesbar { display: block; }
  #notesbar h4 {
    margin: 0 0 8px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-3);
  }
  #notes {
    margin: 0; padding-left: 18px;
    font-size: 14.5px; line-height: 1.5; color: var(--ink-2);
    display: grid; gap: 5px;
  }

  /* projection scale: FHD and up gets larger HUD type so bullets read
     from the back of the room */
  @media (min-width: 1700px) {
    #act { font-size: 17px; }
    #hint { font-size: 14px; }
    #card { max-width: 780px; padding: 26px 32px 24px; }
    #kicker { font-size: 16px; }
    #title { font-size: 52px; }
    #bullets { font-size: 22.5px; gap: 8px; }
    .qr-item img { width: 210px; height: 210px; }
    .qr-t { font-size: 17px; }
    .qr-u { font-size: 16px; }
    .chip { font-size: 15px; padding: 6px 14px; }
    #stepnum { font-size: 20px; }
    #notes { font-size: 17px; }
    .dot { width: 11px; height: 11px; }
    #dots { max-width: 440px; gap: 6px; }
  }

  /* overlay-only fallback when WebGL is unavailable */
  body.no3d #scene { display: none; }
  body.no3d {
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(96,165,250,0.08), transparent 60%),
      radial-gradient(700px 500px at 50% 110%, rgba(244,114,182,0.06), transparent 60%),
      var(--bg);
  }
  body.no3d #card {
    left: 50%; top: 50%; bottom: auto;
    transform: translate(-50%, -50%);
    max-width: 760px;
  }

  /* free roam: the world speaks for itself, only the hint stays up.
     Keep these rules last so they win over body.shownotes. */
  #hint-roam { display: none; }
  body.roam #hint-deck { display: none; }
  body.roam #hint-roam { display: inline; }
  body.roam #card, body.roam #act,
  body.roam #progress, body.roam #notesbar, body.roam #qrbox { display: none; }
</style>
</head>
<body>
  <div id="scene"></div>

  <div class="hud" id="act"></div>
  <div class="hud mono" id="hint">
    <span id="hint-deck"><b>&larr; &rarr;</b> step &nbsp; <b>drag</b> rotate &nbsp; <b>wasd</b> move &nbsp; <b>scroll</b> zoom &nbsp; <b>-/+</b> hud &nbsp; <b>N</b> notes &nbsp; <b>O</b> orbit &nbsp; <b>F</b> roam &nbsp; <b>T</b> theme &nbsp; <b>P</b> fullscreen &nbsp; <b>1-6</b> act &nbsp; <b>R</b> reset &nbsp; <b>H</b> hide</span>
    <span id="hint-roam"><b>wasd</b> move &nbsp; <b>drag</b> rotate &nbsp; <b>shift+drag</b> pan &nbsp; <b>scroll</b> zoom &nbsp; <b>O</b> orbit &nbsp; <b>T</b> theme &nbsp; <b>P</b> fullscreen &nbsp; <b>F</b> exit roam &nbsp; <b>H</b> hide</span>
  </div>

  <div class="hud" id="card">
    <div id="kicker" class="mono"></div>
    <h1 id="title"></h1>
    <ul id="bullets"></ul>
    <div id="chips"></div>
  </div>

  <div class="hud" id="qrbox"></div>

  <div class="hud" id="progress">
    <div id="dots"></div>
    <div id="stepnum" class="mono"></div>
  </div>

  <div class="hud" id="notesbar">
    <h4>Speaker notes</h4>
    <ul id="notes"></ul>
  </div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
